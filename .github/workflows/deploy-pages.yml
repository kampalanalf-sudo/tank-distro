name: Publish restaurant and existing homepage

on:
  push:
    branches: ["arena/40771494-tank-distro"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages publishes one artifact for the entire repository. Always include both sites.
concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  # Preserve the original homepage source independently of restaurant changes.
  # This is the existing site's deployed commit, not a second working branch.
  HOMEPAGE_REF: bc5ffe7537ad2acdaa1e20bd0509cfb482203c9e

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out restaurant app
        uses: actions/checkout@v4
      - name: Check out preserved homepage
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HOMEPAGE_REF }}
          path: .legacy-homepage
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .legacy-homepage/package-lock.json
      - name: Install restaurant dependencies
        run: npm ci
      - name: Test restaurant app
        run: npm test
      - name: Verify payment configuration without charging
        run: node scripts/payment-smoke.mjs
      - name: Build restaurant app
        run: npm run build
        env:
          VITE_DELIVERY_MODE: live
      - name: Build preserved homepage
        working-directory: .legacy-homepage
        run: |
          npm ci
          npm run build
      - name: Assemble both sites
        run: |
          mkdir -p .pages-artifact/juicy-chicken
          cp -a .legacy-homepage/dist/. .pages-artifact/
          cp -a dist/. .pages-artifact/juicy-chicken/
          touch .pages-artifact/.nojekyll
          test -f .pages-artifact/index.html
          test -f .pages-artifact/juicy-chicken/index.html
          test -f .pages-artifact/juicy-chicken/food/chicken.jpg
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload complete site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-artifact/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}juicy-chicken/
    steps:
      - name: Deploy both sites
        id: deployment
        uses: actions/deploy-pages@v4
